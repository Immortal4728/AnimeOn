<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#06070a" />
    </linearGradient>
    
    <!-- Neon Accent Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="45%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Drop Shadow / Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Banner Container -->
  <rect x="8" y="8" width="784" height="224" rx="40" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="70" fill="#ec4899" opacity="0.25" filter="blur(25px)" />

  <!-- Icon Mark (Play + Bookmark + Sparkle) -->
  <g transform="translate(45, 40) scale(0.65)">
    <!-- Play Triangle -->
    <path d="M75 40 C75 28 88 20 99 27 L255 137 C265 144 265 158 255 165 L99 275 C88 282 75 274 75 262 Z" fill="url(#neonGrad)" filter="url(#neonGlow)" />
    
    <!-- Bookmark notch shape -->
    <path d="M110 65 L168 108 L168 190 L139 170 L110 190 Z" fill="#0f111a" opacity="0.9" />

    <!-- Anime Sparkle Star -->
    <path d="M250 35 Q250 55 270 55 Q250 55 250 75 Q250 55 230 55 Q250 55 250 35 Z" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <g transform="translate(230, 138)">
    <!-- Main Title "ANIME" -->
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="68" fill="url(#textGrad)" letter-spacing="4">ANIME</text>
    
    <!-- Title "ON" with Neon Pink Glow -->
    <text x="310" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="68" fill="url(#neonGrad)" letter-spacing="4" filter="url(#neonGlow)">ON</text>

    <!-- Tagline below -->
    <text x="5" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" fill="#9ca3af" letter-spacing="6" opacity="0.9">WATCHLIST &amp; MEDIA HUB</text>
  </g>
</svg>
