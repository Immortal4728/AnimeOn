<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#06070a" />
    </linearGradient>
    
    <!-- Neon Accent Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="45%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Inner Glow/Highlight Gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Drop Shadow / Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Card Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />
  
  <!-- Subtle Top Highlight Rim -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="url(#highlightGrad)" stroke-width="2" opacity="0.6" />

  <!-- Ambient Glow Behind Play Icon -->
  <circle cx="256" cy="256" r="120" fill="#ec4899" opacity="0.2" filter="blur(30px)" />

  <!-- Icon Symbol: Modern Neon Play Button + Bookmark cutout -->
  <g transform="translate(16, 0)">
    <!-- Play Triangle -->
    <path d="M175 140 C175 128 188 120 199 127 L355 237 C365 244 365 258 355 265 L199 375 C188 382 175 374 175 362 Z" fill="url(#neonGrad)" filter="url(#neonGlow)" />
    
    <!-- Bookmark notch shape cut into play button -->
    <path d="M210 165 L268 208 L268 290 L239 270 L210 290 Z" fill="#0f111a" opacity="0.9" />

    <!-- Crisp Anime Sparkle Star -->
    <path d="M350 135 Q350 155 370 155 Q350 155 350 175 Q350 155 330 155 Q350 155 350 135 Z" fill="#ffffff" />
    <path d="M350 142 Q350 155 363 155 Q350 155 350 168 Q350 155 337 155 Q350 155 350 142 Z" fill="#f43f5e" />
  </g>
</svg>
